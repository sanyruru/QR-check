<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>原料照合チェック</title>
<style>
  :root {
    --green: #2d6a4f; --green-light: #52b788; --green-pale: #d8f3dc;
    --red: #c1121f; --red-pale: #ffe8e8; --blue: #1a5276;
    --bg: #f4f1eb; --surface: #ffffff; --text: #1a1a1a; --muted: #888; --border: #e0dbd0;
    --orange: #e76f00;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Helvetica Neue', Arial, sans-serif; background: var(--bg); min-height: 100vh; padding: 16px; }
  .header { text-align: center; margin-bottom: 16px; }
  .header-brand { font-size: 11px; letter-spacing: 0.2em; color: var(--muted); margin-bottom: 4px; }
  .header-title { font-size: 18px; font-weight: 700; color: var(--green); }

  .product-card { background: var(--blue); border-radius: 14px; padding: 14px 16px; margin-bottom: 16px; display: flex; align-items: center; gap: 12px; }
  .product-icon { width: 40px; height: 40px; background: rgba(255,255,255,0.2); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
  .product-name { font-size: 16px; font-weight: 700; color: white; }
  .product-sub { font-size: 12px; color: rgba(255,255,255,0.7); margin-top: 2px; }

  .result-card { border-radius: 16px; padding: 24px; text-align: center; margin-bottom: 16px; animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes popIn { 0% { transform: scale(0.85); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  .result-card.ok { background: var(--green); color: white; }
  .result-card.error { background: var(--red); color: white; animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), shake 0.5s ease 0.4s; }
  @keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(6px); } }
  .result-icon { font-size: 52px; margin-bottom: 10px; display: block; }
  .result-title { font-size: 26px; font-weight: 900; margin-bottom: 6px; }
  .result-name { font-size: 18px; font-weight: 700; opacity: 0.9; }
  .result-msg { font-size: 14px; opacity: 0.8; margin-top: 8px; line-height: 1.5; }

  .amount-card { background: var(--green-pale); border-radius: 14px; padding: 16px; border: 1.5px solid var(--green-light); margin-bottom: 16px; text-align: center; }
  .amount-label { font-size: 11px; font-weight: 700; color: var(--green); letter-spacing: 0.1em; margin-bottom: 4px; }
  .amount-value { font-size: 40px; font-weight: 900; color: var(--green); font-family: monospace; }

  .card { background: var(--surface); border-radius: 14px; padding: 16px; border: 1px solid var(--border); margin-bottom: 16px; }
  .card-title { font-size: 11px; font-weight: 700; letter-spacing: 0.15em; color: var(--muted); margin-bottom: 12px; }
  .detail-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .detail-row:last-child { border-bottom: none; }
  .detail-label { color: var(--muted); }
  .detail-value { font-weight: 500; color: var(--text); font-family: monospace; }

  .progress-header { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .progress-bar { height: 8px; background: var(--border); border-radius: 99px; overflow: hidden; margin-bottom: 12px; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--green-light), var(--green)); border-radius: 99px; transition: width 0.5s ease; }
  .ingredient-list { display: flex; flex-direction: column; gap: 6px; }
  .ingredient-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: var(--bg); border-radius: 8px; border: 1.5px solid var(--border); font-size: 12px; }
  .ingredient-item.checked { background: var(--green-pale); border-color: var(--green-light); }
  .ingredient-item.pending { background: #fff8f0; border-color: var(--orange); }
  .ingredient-check { width: 22px; height: 22px; border-radius: 50%; background: var(--border); display: flex; align-items: center; justify-content: center; font-size: 11px; flex-shrink: 0; color: var(--muted); }
  .ingredient-item.checked .ingredient-check { background: var(--green); color: white; }
  .ingredient-item.pending .ingredient-check { background: var(--orange); color: white; }
  .ingredient-info { flex: 1; }
  .ingredient-name { font-weight: 500; color: var(--text); }
  .ingredient-amount { font-size: 11px; color: var(--muted); font-family: monospace; }

  .log-item { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 12px; }
  .log-item:last-child { border-bottom: none; }
  .log-badge { padding: 2px 7px; border-radius: 20px; font-size: 10px; font-weight: 700; flex-shrink: 0; }
  .log-badge.ok { background: var(--green-pale); color: var(--green); }
  .log-badge.ng { background: var(--red-pale); color: var(--red); }
  .log-text { flex: 1; color: var(--text); }
  .log-time { color: var(--muted); font-family: monospace; font-size: 11px; }
  .empty-log { text-align: center; color: var(--muted); font-size: 13px; padding: 12px; }

  .complete-banner { background: var(--green); border-radius: 16px; padding: 24px; text-align: center; margin-bottom: 16px; animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
  .complete-banner .big { font-size: 48px; margin-bottom: 8px; }
  .complete-banner h2 { font-size: 20px; font-weight: 900; color: white; }
  .complete-banner p { font-size: 13px; color: rgba(255,255,255,0.8); margin-top: 4px; }

  .btn-complete { width: 100%; padding: 18px; background: var(--green); border: none; border-radius: 14px; font-size: 17px; font-weight: 700; color: white; cursor: pointer; margin-bottom: 8px; letter-spacing: 0.05em; }
  .btn-reset { width: 100%; padding: 14px; background: var(--surface); border: 2px solid var(--border); border-radius: 12px; font-size: 14px; font-weight: 500; color: var(--muted); cursor: pointer; margin-bottom: 8px; }

  .wait-card { background: var(--surface); border-radius: 14px; padding: 28px; text-align: center; border: 1px solid var(--border); margin-bottom: 16px; }
  .wait-icon { font-size: 48px; margin-bottom: 12px; }
  .wait-title { font-size: 16px; font-weight: 700; margin-bottom: 6px; color: var(--text); }
  .wait-sub { font-size: 13px; color: var(--muted); line-height: 1.6; }

  .pending-card { background: #fff8f0; border: 2px solid var(--orange); border-radius: 14px; padding: 16px; margin-bottom: 16px; text-align: center; }
  .pending-label { font-size: 13px; color: var(--orange); font-weight: 700; margin-bottom: 4px; }
  .pending-name { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 12px; }

  /* 警告モーダル */
  .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 100; animation: fadeIn 0.2s ease; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal { background: white; border-radius: 16px; padding: 24px; margin: 16px; text-align: center; max-width: 320px; width: 100%; }
  .modal-icon { font-size: 48px; margin-bottom: 12px; }
  .modal-title { font-size: 18px; font-weight: 900; color: var(--orange); margin-bottom: 8px; }
  .modal-msg { font-size: 14px; color: var(--text); line-height: 1.6; margin-bottom: 20px; }
  .modal-btn { width: 100%; padding: 14px; background: var(--orange); border: none; border-radius: 12px; font-size: 15px; font-weight: 700; color: white; cursor: pointer; }
</style>
</head>
<body>

<div class="header">
  <div class="header-brand">原料照合システム</div>
  <div class="header-title">製造管理</div>
</div>

<div id="app"></div>
<div id="modal"></div>

<script>
const PRODUCT = {
  code: 'CP0727',
  name: 'ユルナチュール',
  ingredients: {
    '00135': { name: 'スクワラン',     shelf: '1-1-3-2', amount: '13,800g' },
    '00223': { name: '精製ホホバ油',   shelf: '1-1-4-3', amount: '9,130.77g' },
    '00893': { name: 'ウコン油',       shelf: '1-2-1-6', amount: '23g' },
    '00894': { name: 'ウコンS',        shelf: '1-2-1-7', amount: '0.23g' },
    '00082': { name: 'カロットオイル', shelf: '1-12',    amount: '46g' },
  }
};

const ALL_INGREDIENTS = {
  '00075': { name: '濃いグリセリン', shelf: '?' },
  '00153': { name: 'サラコス99',    shelf: '?' },
};

let checkedCodes = JSON.parse(localStorage.getItem('cc') || '[]');
let logs         = JSON.parse(localStorage.getItem('lg') || '[]');
let pendingCode  = localStorage.getItem('pc') || null;
let pendingName  = localStorage.getItem('pn') || null;

function save() {
  localStorage.setItem('cc', JSON.stringify(checkedCodes));
  localStorage.setItem('lg', JSON.stringify(logs));
}

function savePending(code, name) {
  pendingCode = code;
  pendingName = name;
  localStorage.setItem('pc', code);
  localStorage.setItem('pn', name);
}

function clearPending() {
  pendingCode = null;
  pendingName = null;
  localStorage.removeItem('pc');
  localStorage.removeItem('pn');
}

let audioCtx = null;

function vibrateOK()       { localStorage.setItem("vib", "ok"); }
function vibrateError()    { localStorage.setItem("vib", "error"); }
function vibrateLoaded()   { localStorage.setItem("vib", "loaded"); }
function vibrateComplete() { localStorage.setItem("vib", "complete"); }

function playOK() {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.type = 'sine';
  osc.frequency.setValueAtTime(880, audioCtx.currentTime);
  osc.frequency.setValueAtTime(1100, audioCtx.currentTime + 0.1);
  gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
  osc.start(audioCtx.currentTime); osc.stop(audioCtx.currentTime + 0.3);
}

function playError() {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(220, audioCtx.currentTime);
  osc.frequency.setValueAtTime(150, audioCtx.currentTime + 0.2);
  gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
  osc.start(audioCtx.currentTime); osc.stop(audioCtx.currentTime + 0.5);
}

function playLoaded() {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.type = 'sine';
  osc.frequency.setValueAtTime(660, audioCtx.currentTime);
  gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
  osc.start(audioCtx.currentTime); osc.stop(audioCtx.currentTime + 0.2);
}

function playComplete() {
  if (!audioCtx) return;
  [523, 659, 784, 1047].forEach((freq, i) => {
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime + i * 0.12);
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime + i * 0.12);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i * 0.12 + 0.2);
    osc.start(audioCtx.currentTime + i * 0.12);
    osc.stop(audioCtx.currentTime + i * 0.12 + 0.2);
  });
}

function completeMeasure(code, name) {
  if (!checkedCodes.includes(code)) checkedCodes.push(code);
  const time = new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  logs.unshift({ result: 'ok', name: name, code: code, time });
  save();
  clearPending();
  const found = PRODUCT.ingredients[code];
  renderOK(name, code, found.shelf, found.amount, false, true);
}

function showWarning(pendingIngName) {
  document.getElementById('modal').innerHTML = `
    <div class="modal-overlay">
      <div class="modal">
        <div class="modal-icon">⚠️</div>
        <div class="modal-title">計量が完了していません</div>
        <div class="modal-msg">「${pendingIngName}」の計量を完了してから<br>次の原料をスキャンしてください</div>
        <button class="modal-btn" onclick="closeWarning()">戻って計量完了する</button>
      </div>
    </div>
  `;
}

function closeWarning() {
  document.getElementById('modal').innerHTML = '';
  // 計量待ち原料のOK画面に戻る
  const found = PRODUCT.ingredients[pendingCode];
  if (found) renderOK(found.name, pendingCode, found.shelf, found.amount, false, false);
}

function processURL() {
  const params = new URLSearchParams(window.location.search);
  const d = params.get('d');
  if (!d) { renderWait(); return; }

  const code = d.trim();

  if (code === PRODUCT.code) {
    localStorage.setItem('cp', JSON.stringify({ code: PRODUCT.code, name: PRODUCT.name }));
    playLoaded(); vibrateLoaded();
    renderProductLoaded();
    return;
  }

  const cp = JSON.parse(localStorage.getItem('cp') || 'null');
  if (!cp) { renderProductScan(); return; }

  // 計量待ちの原料があり、別の原料をスキャンしようとした場合
  if (pendingCode && pendingCode !== code) {
    showWarning(pendingName);
    const found = PRODUCT.ingredients[pendingCode];
    if (found) renderOK(found.name, pendingCode, found.shelf, found.amount, false, false);
    return;
  }

  const found = PRODUCT.ingredients[code];
  const time = new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

  if (found) {
    const already = checkedCodes.includes(code);
    if (already) {
      logs.unshift({ result: 'ok', name: found.name, code: code, time });
      save();
      playOK(); vibrateOK();
      renderOK(found.name, code, found.shelf, found.amount, true, false);
    } else {
      savePending(code, found.name);
      playOK(); vibrateOK();
      renderOK(found.name, code, found.shelf, found.amount, false, false);
    }
  } else {
    const errIng = ALL_INGREDIENTS[code];
    const errName = errIng ? errIng.name : '不明な原料';
    logs.unshift({ result: 'ng', name: errName, code: code, time });
    save();
    playError(); vibrateError();
    renderError(code);
  }
}

function renderProductLoaded() {
  const total = Object.keys(PRODUCT.ingredients).length;
  document.getElementById('app').innerHTML = `
    <div class="result-card loaded" style="background:var(--blue);color:white;border-radius:16px;padding:24px;text-align:center;margin-bottom:16px;">
      <span style="font-size:52px;margin-bottom:10px;display:block;">📋</span>
      <div style="font-size:26px;font-weight:900;margin-bottom:6px;">読み込み完了！</div>
      <div style="font-size:18px;font-weight:700;opacity:0.9;">${PRODUCT.name}</div>
      <div style="font-size:14px;opacity:0.8;margin-top:8px;">原料 ${total}種類が登録されました<br>次に原料をスキャンしてください</div>
    </div>
    ${renderProductCard()}
    ${renderProgress()}
    ${renderLog()}
    <button class="btn-reset" onclick="goToStart()">↩️ 最初からやり直す</button>
    <button class="btn-reset" onclick="resetAll()">🔄 リセット</button>
  `;
}

function renderWait() {
  document.getElementById('app').innerHTML = `
    <div class="wait-card">
      <div class="wait-icon">🧴</div>
      <div class="wait-title">ユルナチュール 原料照合システム</div>
      <div class="wait-sub">原料のQRコードをカメラで読み取ってください<br>自動で照合結果が表示されます</div>
    </div>
    ${renderProductCard()}
    ${renderProgress()}
    ${renderLog()}
    <button class="btn-reset" onclick="goToStart()">↩️ 最初からやり直す</button>
    <button class="btn-reset" onclick="resetAll()">🔄 リセット</button>
  `;
}

function renderOK(name, code, shelf, amount, already, measured) {
  const total = Object.keys(PRODUCT.ingredients).length;
  if (checkedCodes.length === total) {
    playComplete(); vibrateComplete();
    document.getElementById('app').innerHTML = `
      <div class="complete-banner">
        <div class="big">🎉</div>
        <h2>全原料の照合が完了！</h2>
        <p>${total}/${total} 原料すべて合格 — 製造を開始できます</p>
      </div>
      ${renderProductCard()}
      ${renderProgress()}
      ${renderLog()}
      <button class="btn-reset" onclick="resetAll()">🔄 リセット</button>
    `;
    return;
  }
  document.getElementById('app').innerHTML = `
    <div class="result-card ok">
      <span class="result-icon">✅</span>
      <div class="result-title">${already ? '照合済み' : 'OK！'}</div>
      <div class="result-name">${name}</div>
      <div class="result-msg">${already ? 'この原料はすでに照合済みです' : '正しい原料です'}</div>
    </div>
    <div class="amount-card">
      <div class="amount-label">必要量（${PRODUCT.name}用）</div>
      <div class="amount-value">${amount}</div>
    </div>
    <div class="card">
      <div class="detail-row"><span class="detail-label">OPコード</span><span class="detail-value">${code}</span></div>
      <div class="detail-row"><span class="detail-label">棚番</span><span class="detail-value">${shelf}</span></div>
    </div>
    ${!already && !measured ? `<button class="btn-complete" onclick="completeMeasure('${code}', '${name}')">計量完了 ✅</button>` : ''}
    ${renderProductCard()}
    ${renderProgress()}
    ${renderLog()}
    <button class="btn-reset" onclick="resetAll()">🔄 リセット</button>
  `;
}

function renderError(code) {
  const ing = ALL_INGREDIENTS[code];
  const name = ing ? ing.name : '不明な原料';
  const shelf = ing ? ing.shelf : '?';
  document.getElementById('app').innerHTML = `
    <div class="result-card error">
      <span class="result-icon">❌</span>
      <div class="result-title">エラー！</div>
      <div class="result-name">${name}</div>
      <div class="result-msg">OPコード：${code}<br>棚番：${shelf}<br>「${PRODUCT.name}」に使用する原料ではありません</div>
    </div>
    ${renderProductCard()}
    ${renderProgress()}
    ${renderLog()}
    <button class="btn-reset" onclick="resetAll()">🔄 リセット</button>
  `;
}

function renderProductCard() {
  const total = Object.keys(PRODUCT.ingredients).length;
  return `
    <div class="product-card">
      <div class="product-icon">🧴</div>
      <div>
        <div class="product-name">${PRODUCT.name}</div>
        <div class="product-sub">${PRODUCT.code} ／ 原料 ${total}種類</div>
      </div>
    </div>
  `;
}

function renderProgress() {
  const ings = PRODUCT.ingredients;
  const total = Object.keys(ings).length;
  const count = checkedCodes.length;
  const pct = Math.round((count / total) * 100);
  const items = Object.entries(ings).map(([c, ing]) => {
    const checked = checkedCodes.includes(c);
    const pending = pendingCode === c;
    return `<div class="ingredient-item ${checked ? 'checked' : pending ? 'pending' : ''}">
      <div class="ingredient-check">${checked ? '✓' : pending ? '⏳' : ''}</div>
      <div class="ingredient-info">
        <div class="ingredient-name">${ing.name}${pending ? ' <span style="color:var(--orange);font-size:10px;">計量中</span>' : ''}</div>
        <div class="ingredient-amount">${ing.amount} ／ 棚：${ing.shelf}</div>
      </div>
    </div>`;
  }).join('');
  return `
    <div class="card">
      <div class="card-title">照合進捗</div>
      <div class="progress-header"><span>進捗</span><span>${count} / ${total}</span></div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="ingredient-list">${items}</div>
    </div>
  `;
}

function renderLog() {
  if (logs.length === 0) return `<div class="card"><div class="card-title">スキャン記録</div><div class="empty-log">まだ記録がありません</div></div>`;
  return `<div class="card"><div class="card-title">スキャン記録</div>${logs.map(l => `
    <div class="log-item">
      <div class="log-badge ${l.result}">${l.result === 'ok' ? 'OK' : 'NG'}</div>
      <div class="log-text">${l.name}（${l.code}）</div>
      <div class="log-time">${l.time}</div>
    </div>`).join('')}</div>`;
}

function goToStart() {
  localStorage.removeItem('cc');
  localStorage.removeItem('lg');
  localStorage.removeItem('cp');
  clearPending();
  checkedCodes = []; logs = [];
  renderProductScan();
}

function resetAll() {
  localStorage.removeItem('cc');
  localStorage.removeItem('lg');
  clearPending();
  checkedCodes = []; logs = [];
  renderWait();
}

function renderProductScan() {
  document.getElementById('app').innerHTML = `
    <div class="wait-card">
      <div class="wait-icon">📋</div>
      <div class="wait-title">製造指示書をスキャンしてください</div>
      <div class="wait-sub">DIGNOのカメラアプリで製造指示書の<br>QRコードを読み取ってください</div>
    </div>
    <div class="card">
      <div class="card-title">手順</div>
      <div style="font-size:13px;color:var(--muted);line-height:2;">
        1. DIGNOのカメラアプリを起動<br>
        2. 製造指示書のQRコードを読み取る<br>
        3. 表示されたURLをタップ<br>
        4. 原料照合画面が開く
      </div>
    </div>
  `;
}

const urlParams = new URLSearchParams(window.location.search);
const hasD = urlParams.get('d');
const hasCp = localStorage.getItem('cp');

if (hasD) {
  processURL();
} else if (hasCp) {
  renderWait();
} else {
  renderProductScan();
}

window.addEventListener('load', function() {
  const vib = localStorage.getItem('vib');
  if (vib === 'ok') {
    setTimeout(() => { if (navigator.vibrate) navigator.vibrate(100); }, 300);
  } else if (vib === 'error') {
    setTimeout(() => { if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 200]); }, 300);
  } else if (vib === 'loaded') {
    setTimeout(() => { if (navigator.vibrate) navigator.vibrate(50); }, 300);
  } else if (vib === 'complete') {
    setTimeout(() => { if (navigator.vibrate) navigator.vibrate([100, 50, 100, 50, 300]); }, 300);
  }
  localStorage.removeItem('vib');
});
</script>
