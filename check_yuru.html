<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>原料照合チェック</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root {
    --green: #2d6a4f; --green-light: #52b788; --green-pale: #d8f3dc;
    --red: #c1121f; --red-pale: #ffe8e8; --blue: #1a5276;
    --bg: #f4f1eb; --surface: #ffffff; --text: #1a1a1a; --muted: #888; --border: #e0dbd0;
    --orange: #e76f00;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Helvetica Neue', Arial, sans-serif; background: var(--bg); min-height: 100vh; padding: 16px; }
  .header { text-align: center; margin-bottom: 16px; }
  .header-brand { font-size: 11px; letter-spacing: 0.2em; color: var(--muted); margin-bottom: 4px; }
  .header-title { font-size: 18px; font-weight: 700; color: var(--green); }

  /* ─── QRスキャナー（新規追加） ─── */
  .scanner-card { background: var(--surface); border-radius: 14px; padding: 16px; border: 1.5px solid var(--green-light); margin-bottom: 16px; }
  .scanner-card .card-title { color: var(--green); }
  #reader { width: 100%; max-width: 380px; margin: 0 auto 12px; border-radius: 10px; overflow: hidden; }
  #reader.hidden { display: none; }
  .btn-scan { width: 100%; padding: 16px; background: var(--green); border: none; border-radius: 12px; font-size: 16px; font-weight: 700; color: white; cursor: pointer; -webkit-appearance: none; }
  .btn-scan.stop { background: var(--muted); }
  .scan-hint { font-size: 12px; color: var(--muted); text-align: center; margin-top: 8px; line-height: 1.5; }

  .product-card { background: var(--blue); border-radius: 14px; padding: 14px 16px; margin-bottom: 16px; display: flex; align-items: center; gap: 12px; }
  .product-icon { width: 40px; height: 40px; background: rgba(255,255,255,0.2); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
  .product-name { font-size: 16px; font-weight: 700; color: white; }
  .product-sub { font-size: 12px; color: rgba(255,255,255,0.7); margin-top: 2px; }

  .result-card { border-radius: 16px; padding: 24px; text-align: center; margin-bottom: 16px; animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes popIn { 0% { transform: scale(0.85); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  .result-card.ok { background: var(--green); color: white; }
  .result-card.error { background: var(--red); color: white; animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), shake 0.5s ease 0.4s; }
  @keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(6px); } }
  .result-icon { font-size: 52px; margin-bottom: 10px; display: block; }
  .result-title { font-size: 26px; font-weight: 900; margin-bottom: 6px; }
  .result-name { font-size: 18px; font-weight: 700; opacity: 0.9; }
  .result-msg { font-size: 14px; opacity: 0.8; margin-top: 8px; line-height: 1.5; }

  .amount-card { background: var(--green-pale); border-radius: 14px; padding: 16px; border: 1.5px solid var(--green-light); margin-bottom: 16px; text-align: center; }
  .amount-label { font-size: 11px; font-weight: 700; color: var(--green); letter-spacing: 0.1em; margin-bottom: 4px; }
  .amount-value { font-size: 40px; font-weight: 900; color: var(--green); font-family: monospace; }

  .card { background: var(--surface); border-radius: 14px; padding: 16px; border: 1px solid var(--border); margin-bottom: 16px; }
  .card-title { font-size: 11px; font-weight: 700; letter-spacing: 0.15em; color: var(--muted); margin-bottom: 12px; }
  .detail-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .detail-row:last-child { border-bottom: none; }
  .detail-label { color: var(--muted); }
  .detail-value { font-weight: 500; color: var(--text); font-family: monospace; }

  .progress-header { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .progress-bar { height: 8px; background: var(--border); border-radius: 99px; overflow: hidden; margin-bottom: 12px; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--green-light), var(--green)); border-radius: 99px; transition: width 0.5s ease; }
  .ingredient-list { display: flex; flex-direction: column; gap: 6px; }
  .ingredient-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: var(--bg); border-radius: 8px; border: 1.5px solid var(--border); font-size: 12px; }
  .ingredient-item.checked { background: var(--green-pale); border-color: var(--green-light); }
  .ingredient-item.pending { background: #fff8f0; border-color: var(--orange); }
  .ingredient-check { width: 22px; height: 22px; border-radius: 50%; background: var(--border); display: flex; align-items: center; justify-content: center; font-size: 11px; flex-shrink: 0; color: var(--muted); }
  .ingredient-item.checked .ingredient-check { background: var(--green); color: white; }
  .ingredient-item.pending .ingredient-check { background: var(--orange); color: white; }
  .ingredient-info { flex: 1; }
  .ingredient-name { font-weight: 500; color: var(--text); }
  .ingredient-amount { font-size: 11px; color: var(--muted); font-family: monospace; }

  .log-item { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 12px; }
  .log-item:last-child { border-bottom: none; }
  .log-badge { padding: 2px 7px; border-radius: 20px; font-size: 10px; font-weight: 700; flex-shrink: 0; }
  .log-badge.ok { background: var(--green-pale); color: var(--green); }
  .log-badge.ng { background: var(--red-pale); color: var(--red); }
  .log-text { flex: 1; color: var(--text); }
  .log-time { color: var(--muted); font-family: monospace; font-size: 11px; }
  .empty-log { text-align: center; color: var(--muted); font-size: 13px; padding: 12px; }

  .complete-banner { background: var(--green); border-radius: 16px; padding: 24px; text-align: center; margin-bottom: 16px; animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
  .complete-banner .big { font-size: 48px; margin-bottom: 8px; }
  .complete-banner h2 { font-size: 20px; font-weight: 900; color: white; }
  .complete-banner p { font-size: 13px; color: rgba(255,255,255,0.8); margin-top: 4px; }

  .btn-complete { width: 100%; padding: 18px; background: var(--green); border: none; border-radius: 14px; font-size: 17px; font-weight: 700; color: white; cursor: pointer; margin-bottom: 8px; letter-spacing: 0.05em; -webkit-appearance: none; }
  .btn-reset { width: 100%; padding: 14px; background: var(--surface); border: 2px solid var(--border); border-radius: 12px; font-size: 14px; font-weight: 500; color: var(--muted); cursor: pointer; margin-bottom: 8px; -webkit-appearance: none; }

  .wait-card { background: var(--surface); border-radius: 14px; padding: 28px; text-align: center; border: 1px solid var(--border); margin-bottom: 16px; }
  .wait-icon { font-size: 48px; margin-bottom: 12px; }
  .wait-title { font-size: 16px; font-weight: 700; margin-bottom: 6px; color: var(--text); }
  .wait-sub { font-size: 13px; color: var(--muted); line-height: 1.6; }

  /* 警告モーダル */
  .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 100; animation: fadeIn 0.2s ease; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal { background: white; border-radius: 16px; padding: 24px; margin: 16px; text-align: center; max-width: 320px; width: 100%; }
  .modal-icon { font-size: 48px; margin-bottom: 12px; }
  .modal-title { font-size: 18px; font-weight: 900; color: var(--orange); margin-bottom: 8px; }
  .modal-msg { font-size: 14px; color: var(--text); line-height: 1.6; margin-bottom: 20px; }
  .modal-btn { width: 100%; padding: 14px; background: var(--orange); border: none; border-radius: 12px; font-size: 15px; font-weight: 700; color: white; cursor: pointer; }

  /* 視覚フラッシュ（音が鳴らせない環境向けの補助フィードバック） */
  #flash {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none; z-index: 50; opacity: 0;
  }
  #flash.ok  { animation: flashGreen 0.45s forwards; }
  #flash.err { animation: flashRed   0.45s forwards; }
  @keyframes flashGreen {
    0%   { opacity: 1; background: rgba(82, 183, 136, 0.40); }
    100% { opacity: 0; background: rgba(82, 183, 136, 0); }
  }
  @keyframes flashRed {
    0%   { opacity: 1; background: rgba(193, 18, 31, 0.40); }
    100% { opacity: 0; background: rgba(193, 18, 31, 0); }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-brand">原料照合システム</div>
  <div class="header-title">製造管理</div>
</div>

<!-- ▼▼▼ 新規追加：ページ内カメラスキャナー ▼▼▼ -->
<div class="scanner-card">
  <div class="card-title">QRスキャナー</div>
  <div id="reader" class="hidden"></div>
  <button id="scanToggleBtn" class="btn-scan" onclick="toggleScanning()">📷 スキャン開始</button>
  <div class="scan-hint">枠の中に、読み取りたいラベル1枚だけが入るように近づけてください</div>
</div>
<!-- ▲▲▲ 新規追加ここまで ▲▲▲ -->

<div id="app"></div>
<div id="modal"></div>
<div id="flash"></div>

<script>
// 会社全体の原料マスター（名前・棚番）。新しい原料が増えたらここに追加するだけでOK
const MASTER_INGREDIENTS = {
  '00135': { name: 'スクワラン',     shelf: '1-1-3-2' },
  '00223': { name: '精製ホホバ油',   shelf: '1-1-4-3' },
  '00893': { name: 'ウコン油',       shelf: '1-2-1-6' },
  '00894': { name: 'ウコンS',        shelf: '1-2-1-7' },
  '00082': { name: 'カロットオイル', shelf: '1-12' },
  '00075': { name: '濃いグリセリン', shelf: '?' },
  '00153': { name: 'サラコス99',    shelf: '?' },
};

// 現在読み込んでいる製品（製造指示書QRを読むたびに入れ替わる）
// 形式: { code, name, ingredients: { '00135': 60.0, '00223': 39.699, ... } }
let currentProduct = JSON.parse(localStorage.getItem('cp') || 'null');

// 製造指示書QRの中身を解析する。
// 例: "CP0727,ユルナチュール,00135:60.0,00223:39.699,00893:0.1,00894:0.001,00082:0.2"
// 解析できなければ null を返す（＝製造指示書QRではない＝原料QRとして扱う）
function parseInstructionCode(raw) {
  if (!raw.includes(',') || !raw.includes(':')) return null;
  const parts = raw.split(',');
  if (parts.length < 2) return null;
  const code = parts[0].trim();
  const name = parts[1].trim();
  const ingredients = {};
  for (let i = 2; i < parts.length; i++) {
    const [ingCode, pctStr] = parts[i].split(':');
    if (!ingCode || pctStr === undefined) continue;
    const pct = parseFloat(pctStr);
    if (!isNaN(pct)) ingredients[ingCode.trim()] = pct;
  }
  if (Object.keys(ingredients).length === 0) return null;
  return { code, name, ingredients };
}

function getBatchKg() {
  const v = localStorage.getItem('bk');
  return v ? parseFloat(v) : null;
}
function setBatchKg(kg) {
  localStorage.setItem('bk', String(kg));
}
function formatGrams(num) {
  let rounded = Math.round(num * 100) / 100;
  let parts = rounded.toString().split('.');
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return parts.join('.') + 'g';
}
function computeAmount(code) {
  const kg = getBatchKg();
  if (!currentProduct || kg === null) return '―';
  const pct = currentProduct.ingredients[code];
  if (pct === undefined) return '―';
  const totalGrams = kg * 1000;
  return formatGrams(totalGrams * pct / 100);
}

/* ─────────────────────────────────────────
   トレーサビリティ記録（GAS経由でGoogleスプレッドシートへ）
   ※ GAS_URL は、GASをウェブアプリとしてデプロイした後に発行される
     URL（.../exec で終わるもの）に書き換えてください。
     空欄のままなら何もせず無視されます。
───────────────────────────────────────── */
const GAS_URL = 'https://script.google.com/macros/s/AKfycby9rd6uPUKem7EfJFwGdWH17PVBJ8gJTNzkVsrFZh1H6khwLQ0RtjnZF_cb0812iE6nJw/exec'; // 例: 'https://script.google.com/macros/s/xxxxx/exec'

function logToSheet(ingredientName, ingredientCode, result) {
  if (!GAS_URL) return; // 未設定なら何もしない
  const payload = {
    datetime: new Date().toLocaleString('ja-JP'),
    productCode: currentProduct ? currentProduct.code : '',
    productName: currentProduct ? currentProduct.name : '',
    batchKg: getBatchKg() || '',
    ingredientName,
    ingredientCode,
    result
  };
  // GASのウェブアプリはCORSに対応していないため mode:'no-cors' で送信
  // （送信結果は読み取れないが、記録自体は正常に行われる）
  fetch(GAS_URL, {
    method: 'POST',
    mode: 'no-cors',
    body: JSON.stringify(payload)
  }).catch(() => {});
}

let checkedCodes = JSON.parse(localStorage.getItem('cc') || '[]');
let logs         = JSON.parse(localStorage.getItem('lg') || '[]');
let pendingCode  = localStorage.getItem('pc') || null;
let pendingName  = localStorage.getItem('pn') || null;

function save() {
  localStorage.setItem('cc', JSON.stringify(checkedCodes));
  localStorage.setItem('lg', JSON.stringify(logs));
}
function savePending(code, name) {
  pendingCode = code; pendingName = name;
  localStorage.setItem('pc', code); localStorage.setItem('pn', name);
}
function clearPending() {
  pendingCode = null; pendingName = null;
  localStorage.removeItem('pc'); localStorage.removeItem('pn');
}


/* ─────────────────────────────────────────
   効果音（Web Audio API・音声ファイル不要）
───────────────────────────────────────── */
let _actx = null;
function getAudioCtx() {
  if (!_actx) {
    try { _actx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) { return null; }
  }
  return _actx;
}
async function resumeCtx(ctx) {
  if (ctx && ctx.state === 'suspended') {
    try { await ctx.resume(); } catch (e) {}
  }
}
function beep(ctx, {freq, duration, type = 'sine', gain = 0.3, delay = 0}) {
  const osc = ctx.createOscillator();
  const g = ctx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  g.gain.value = gain;
  osc.connect(g);
  g.connect(ctx.destination);
  osc.start(ctx.currentTime + delay);
  osc.stop(ctx.currentTime + delay + duration);
}
async function playOkSound() {
  const ctx = getAudioCtx();
  if (!ctx) return;
  await resumeCtx(ctx);
  try {
    beep(ctx, {freq: 880,  duration: 0.12, gain: 0.25});
    beep(ctx, {freq: 1320, duration: 0.15, gain: 0.25, delay: 0.12});
  } catch (e) {}
}
async function playNgSound() {
  const ctx = getAudioCtx();
  if (!ctx) return;
  await resumeCtx(ctx);
  try { beep(ctx, {freq: 160, duration: 0.35, type: 'sawtooth', gain: 0.3}); } catch (e) {}
}
// 「照合済み」（2回目以降の同じ原料）専用：控えめな単音「ポン」
async function playAlreadySound() {
  const ctx = getAudioCtx();
  if (!ctx) return;
  await resumeCtx(ctx);
  try { beep(ctx, {freq: 600, duration: 0.15, type: 'sine', gain: 0.15}); } catch (e) {}
}
// 製造指示書を読み込んだ時専用：3音の軽快なチャイム（矩形波でOK音とは違う質感に）
async function playLoadedSound() {
  const ctx = getAudioCtx();
  if (!ctx) return;
  await resumeCtx(ctx);
  try {
    beep(ctx, {freq: 523, duration: 0.1,  type: 'square', gain: 0.18, delay: 0});
    beep(ctx, {freq: 659, duration: 0.1,  type: 'square', gain: 0.18, delay: 0.1});
    beep(ctx, {freq: 784, duration: 0.2,  type: 'square', gain: 0.2,  delay: 0.2});
  } catch (e) {}
}
// 全原料の照合が完了した時専用：ちょっと華やかなファンファーレ
async function playCompleteSound() {
  const ctx = getAudioCtx();
  if (!ctx) return;
  await resumeCtx(ctx);
  try {
    // ドミソド（上昇アルペジオ）→ 最後にちょっと伸ばして華やかに
    beep(ctx, {freq: 523.25, duration: 0.14, type: 'triangle', gain: 0.22, delay: 0});
    beep(ctx, {freq: 659.25, duration: 0.14, type: 'triangle', gain: 0.22, delay: 0.14});
    beep(ctx, {freq: 783.99, duration: 0.14, type: 'triangle', gain: 0.22, delay: 0.28});
    beep(ctx, {freq: 1046.5, duration: 0.45, type: 'triangle', gain: 0.28, delay: 0.42});
    // 少し厚みを出すための下のハモリ
    beep(ctx, {freq: 523.25, duration: 0.45, type: 'sine', gain: 0.15, delay: 0.42});
  } catch (e) {}
}

/* ─────────────────────────────────────────
   フィードバック（視覚フラッシュ＋できる時は音）
───────────────────────────────────────── */
function setFeedback(type) {
  localStorage.setItem('fb', type);
  // 同一ページ内（ライブスキャン時）はその場で即座に鳴らす
  if (type === 'ng') playNgSound();
  else if (type === 'already') playAlreadySound();
  else if (type === 'loaded') playLoadedSound();
  else if (type === 'complete') playCompleteSound();
  else playOkSound();
}

window.addEventListener('load', function () {
  const fb = localStorage.getItem('fb');
  if (!fb) return;
  localStorage.removeItem('fb');

  const el = document.getElementById('flash');
  if (!el) return;
  el.className = '';
  void el.offsetWidth;
  el.className = (fb === 'ok' || fb === 'loaded' || fb === 'complete' || fb === 'already') ? 'ok' : 'err';
});

/* ─────────────────────────────────────────
   判定ロジック（コード1つを受け取って処理する共通関数）
───────────────────────────────────────── */
function handleCode(code) {
  if (!code) return;
  code = code.trim();

  // 製造指示書QRかどうか判定（"コード,製品名,原料コード:割合,..." の形式）
  const parsedProduct = parseInstructionCode(code);
  if (parsedProduct) {
    const isSameProduct = currentProduct && currentProduct.code === parsedProduct.code;
    currentProduct = parsedProduct;
    localStorage.setItem('cp', JSON.stringify(parsedProduct));
    if (!isSameProduct) {
      // 別の製品に切り替わった場合のみ、進捗・生産量をリセットする
      checkedCodes = []; logs = [];
      pendingCode = pendingName = null;
      save(); clearPending();
      localStorage.removeItem('bk');
    }
    setFeedback('loaded');
    if (getBatchKg() === null) {
      renderBatchInput();
    } else {
      renderProductLoaded();
    }
    return;
  }

  if (!currentProduct) { renderProductScan(); return; }

  if (pendingCode && pendingCode !== code) {
    showWarning(pendingName);
    const master = MASTER_INGREDIENTS[pendingCode];
    if (master) renderOK(master.name, pendingCode, master.shelf, computeAmount(pendingCode), false, false);
    return;
  }

  const master = MASTER_INGREDIENTS[code];
  const belongsToProduct = currentProduct.ingredients[code] !== undefined;
  const time = new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

  if (master && belongsToProduct) {
    const already = checkedCodes.includes(code);
    if (already) {
      logs.unshift({ result: 'ok', name: master.name, code, time });
      save();
      setFeedback('already');
      renderOK(master.name, code, master.shelf, computeAmount(code), true, false);
    } else {
      savePending(code, master.name);
      setFeedback('ok');
      logToSheet(master.name, code, 'OK');
      renderOK(master.name, code, master.shelf, computeAmount(code), false, false);
    }
  } else {
    const errName = master ? master.name : '不明な原料';
    logs.unshift({ result: 'ng', name: errName, code, time });
    save();
    setFeedback('ng');
    logToSheet(errName, code, 'NG');
    renderError(code);
  }
}

// 従来通り：URLの ?d= パラメータから起動する経路（そのまま残す）
function processURL() {
  const params = new URLSearchParams(window.location.search);
  const d = params.get('d');
  if (!d) { renderWait(); return; }
  handleCode(d.trim());
}

/* ─────────────────────────────────────────
   ページ内カメラスキャン（html5-qrcode）
───────────────────────────────────────── */
let html5QrCode = null;
let scanning = false;
let lastScanCode = null;
let pendingConfirmCode = null;
let pendingConfirmCount = 0;
const CONFIRM_THRESHOLD = 3; // 同じコードが3回連続で読めたら確定（隣のQRの映り込み対策）

function extractCodeFromScan(decodedText) {
  try {
    const url = new URL(decodedText);
    const d = url.searchParams.get('d');
    if (d) return d.trim();
  } catch (e) {}
  return decodedText.trim();
}

async function toggleScanning() {
  // iPhone(Safari)対策①：ボタンをタップした瞬間に音の準備をしておく
  const ctx = getAudioCtx();
  await resumeCtx(ctx);

  if (scanning) {
    await stopScanning();
    return;
  }
  const readerEl = document.getElementById('reader');
  const btn = document.getElementById('scanToggleBtn');
  readerEl.classList.remove('hidden');

  html5QrCode = new Html5Qrcode("reader");
  try {
    await html5QrCode.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 150, height: 150 } },
      (decodedText) => {
        const code = extractCodeFromScan(decodedText);

        // すでに確定済みの同じQRなら何もしない
        if (code === lastScanCode) { pendingConfirmCode = null; pendingConfirmCount = 0; return; }

        // 隣のQRが一瞬映り込んだだけの誤検知を防ぐため、
        // 同じ新しいコードが連続で読めた時だけ「本当に読んだ」と確定する
        if (code === pendingConfirmCode) {
          pendingConfirmCount++;
        } else {
          pendingConfirmCode = code;
          pendingConfirmCount = 1;
        }

        if (pendingConfirmCount >= CONFIRM_THRESHOLD) {
          lastScanCode = code;
          pendingConfirmCode = null;
          pendingConfirmCount = 0;
          handleCode(code);
        }
      },
      () => {
        // QRが見つからないフレームが挟まると誤検知の元になるので、確定待ちをリセット
        pendingConfirmCode = null;
        pendingConfirmCount = 0;
      }
    );
    scanning = true;
    btn.textContent = '⏹ スキャン停止';
    btn.classList.add('stop');

    // iPhone(Safari)対策②：カメラの許可ダイアログが割り込んで
    // 音が止まってしまうことがあるため、起動が完了した直後にもう一度
    // 音の準備をし直す
    await resumeCtx(getAudioCtx());
  } catch (err) {
    alert('カメラを起動できませんでした。\nHTTPSのURLで開いているか、カメラの使用を許可しているか確認してください。\n\nエラー: ' + err);
    readerEl.classList.add('hidden');
  }
}

async function stopScanning() {
  if (html5QrCode) {
    try { await html5QrCode.stop(); await html5QrCode.clear(); } catch (e) {}
  }
  scanning = false;
  lastScanCode = null;
  pendingConfirmCode = null;
  pendingConfirmCount = 0;
  document.getElementById('reader').classList.add('hidden');
  const btn = document.getElementById('scanToggleBtn');
  btn.textContent = '📷 スキャン開始';
  btn.classList.remove('stop');
}

/* ─────────────────────────────────────────
   画面ロック・アプリ切り替え後の自動復帰
   （裏に隠れている間にカメラの読み取りが止まってしまうことがあるため、
     画面に戻ってきたタイミングで自動的にスキャンを再起動する）
───────────────────────────────────────── */
let wasScanningBeforeHide = false;

document.addEventListener('visibilitychange', async () => {
  if (document.hidden) {
    // 画面が隠れる直前の状態を覚えておく
    wasScanningBeforeHide = scanning;
  } else {
    // 画面に戻ってきた瞬間、スキャン中だったなら自動で再起動する
    if (wasScanningBeforeHide) {
      wasScanningBeforeHide = false;
      try {
        await stopScanning();
        await toggleScanning();
      } catch (e) {}
    }
  }
});

/* ─────────────────────────────────────────
   描画（元のロジックのまま）
───────────────────────────────────────── */
function completeMeasure(code, name) {
  if (!checkedCodes.includes(code)) checkedCodes.push(code);
  const time = new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  logs.unshift({ result: 'ok', name, code, time });
  save(); clearPending();
  const master = MASTER_INGREDIENTS[code];
  renderOK(name, code, master.shelf, computeAmount(code), false, true);
}

function showWarning(pendingIngName) {
  document.getElementById('modal').innerHTML = `
    <div class="modal-overlay">
      <div class="modal">
        <div class="modal-icon">⚠️</div>
        <div class="modal-title">計量が完了していません</div>
        <div class="modal-msg">「${pendingIngName}」の計量を完了してから<br>次の原料をスキャンしてください</div>
        <button class="modal-btn" onclick="closeWarning()">戻って計量完了する</button>
      </div>
    </div>
  `;
}

function closeWarning() {
  document.getElementById('modal').innerHTML = '';
  const master = MASTER_INGREDIENTS[pendingCode];
  if (master) renderOK(master.name, pendingCode, master.shelf, computeAmount(pendingCode), false, false);
}

function renderBatchInput() {
  document.getElementById('app').innerHTML = `
    <div class="wait-card">
      <div class="wait-icon">⚖️</div>
      <div class="wait-title">本日の生産量を入力してください</div>
      <div class="wait-sub">${currentProduct.name}を何kg作りますか？<br>入力すると各原料の必要量を自動計算します</div>
    </div>
    <div class="card">
      <div class="card-title">生産量（kg）</div>
      <input id="batchKgInput" type="number" inputmode="decimal" step="0.001" placeholder="例：23"
        style="width:100%;padding:14px;font-size:20px;border-radius:10px;border:1.5px solid var(--border);text-align:center;">
    </div>
    <button class="btn-complete" onclick="confirmBatchInput()">この生産量で決定</button>
  `;
  setTimeout(() => { const el = document.getElementById('batchKgInput'); if (el) el.focus(); }, 100);
}

function confirmBatchInput() {
  const el = document.getElementById('batchKgInput');
  const val = parseFloat(el.value);
  if (!val || val <= 0) {
    alert('正しい生産量（kg）を入力してください');
    return;
  }
  setBatchKg(val);
  renderProductLoaded();
}

function editBatch() {
  renderBatchInput();
}

function renderProductLoaded() {
  const total = Object.keys(currentProduct.ingredients).length;
  document.getElementById('app').innerHTML = `
    <div class="result-card ok">
      <span class="result-icon">📋</span>
      <div class="result-title">読み込み完了！</div>
      <div class="result-name">${currentProduct.name}</div>
      <div class="result-msg">原料 ${total}種類が登録されました<br>次に原料をスキャンしてください</div>
    </div>
    ${renderProductCard()}
    ${renderProgress()}
    ${renderLog()}
    <button class="btn-reset" onclick="goToStart()">↩️ 最初からやり直す</button>
    <button class="btn-reset" onclick="resetAll()">🔄 リセット</button>
  `;
}

function renderWait() {
  document.getElementById('app').innerHTML = `
    <div class="wait-card">
      <div class="wait-icon">🧴</div>
      <div class="wait-title">${currentProduct.name} 原料照合システム</div>
      <div class="wait-sub">上の「スキャン開始」からQRコードを読み取ってください<br>自動で照合結果が表示されます</div>
    </div>
    ${renderProductCard()}
    ${renderProgress()}
    ${renderLog()}
    <button class="btn-reset" onclick="goToStart()">↩️ 最初からやり直す</button>
    <button class="btn-reset" onclick="resetAll()">🔄 リセット</button>
  `;
}

function renderOK(name, code, shelf, amount, already, measured) {
  const total = Object.keys(currentProduct.ingredients).length;
  if (checkedCodes.length === total) {
    setFeedback('complete');
    document.getElementById('app').innerHTML = `
      <div class="complete-banner">
        <div class="big">🎉</div>
        <h2>全原料の照合が完了！</h2>
        <p>${total}/${total} 原料すべて合格 — 製造を開始できます</p>
      </div>
      ${renderProductCard()}
      ${renderProgress()}
      ${renderLog()}
      <button class="btn-reset" onclick="resetAll()">🔄 リセット</button>
    `;
    return;
  }
  document.getElementById('app').innerHTML = `
    <div class="result-card ok">
      <span class="result-icon">✅</span>
      <div class="result-title">${already ? '照合済み' : 'OK！'}</div>
      <div class="result-name">${name}</div>
      <div class="result-msg">${already ? 'この原料はすでに照合済みです' : '正しい原料です'}</div>
    </div>
    <div class="amount-card">
      <div class="amount-label">必要量（${currentProduct.name}用）</div>
      <div class="amount-value">${amount}</div>
    </div>
    <div class="card">
      <div class="detail-row"><span class="detail-label">OPコード</span><span class="detail-value">${code}</span></div>
      <div class="detail-row"><span class="detail-label">棚番</span><span class="detail-value">${shelf}</span></div>
    </div>
    ${!already && !measured ? `<button class="btn-complete" onclick="completeMeasure('${code}', '${name}')">計量完了 ✅</button>` : ''}
    ${renderProductCard()}
    ${renderProgress()}
    ${renderLog()}
    <button class="btn-reset" onclick="resetAll()">🔄 リセット</button>
  `;
}

function renderError(code) {
  const ing = MASTER_INGREDIENTS[code];
  const name = ing ? ing.name : '不明な原料';
  const shelf = ing ? ing.shelf : '?';
  document.getElementById('app').innerHTML = `
    <div class="result-card error">
      <span class="result-icon">❌</span>
      <div class="result-title">エラー！</div>
      <div class="result-name">${name}</div>
      <div class="result-msg">OPコード：${code}<br>棚番：${shelf}<br>「${currentProduct.name}」に使用する原料ではありません</div>
    </div>
    ${renderProductCard()}
    ${renderProgress()}
    ${renderLog()}
    <button class="btn-reset" onclick="resetAll()">🔄 リセット</button>
  `;
}

function renderProductCard() {
  const total = Object.keys(currentProduct.ingredients).length;
  const kg = getBatchKg();
  return `
    <div class="product-card">
      <div class="product-icon">🧴</div>
      <div style="flex:1;">
        <div class="product-name">${currentProduct.name}</div>
        <div class="product-sub">${currentProduct.code} ／ 原料 ${total}種類${kg !== null ? ` ／ 生産量 ${kg}kg` : ''}</div>
      </div>
      ${kg !== null ? `<div onclick="editBatch()" style="color:white;font-size:11px;text-decoration:underline;cursor:pointer;white-space:nowrap;">変更</div>` : ''}
    </div>
  `;
}

function renderProgress() {
  const ings = currentProduct.ingredients;
  const total = Object.keys(ings).length;
  const count = checkedCodes.length;
  const pct = Math.round((count / total) * 100);
  const items = Object.entries(ings).map(([c, pct]) => {
    const master = MASTER_INGREDIENTS[c] || { name: c, shelf: '?' };
    const checked = checkedCodes.includes(c);
    const pending = pendingCode === c;
    return `<div class="ingredient-item ${checked ? 'checked' : pending ? 'pending' : ''}">
      <div class="ingredient-check">${checked ? '✓' : pending ? '⏳' : ''}</div>
      <div class="ingredient-info">
        <div class="ingredient-name">${master.name}${pending ? ' <span style="color:var(--orange);font-size:10px;">計量中</span>' : ''}</div>
        <div class="ingredient-amount">${computeAmount(c)} ／ 棚：${master.shelf}</div>
      </div>
    </div>`;
  }).join('');
  return `
    <div class="card">
      <div class="card-title">照合進捗</div>
      <div class="progress-header"><span>進捗</span><span>${count} / ${total}</span></div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="ingredient-list">${items}</div>
    </div>
  `;
}

function renderLog() {
  if (logs.length === 0) return `<div class="card"><div class="card-title">スキャン記録</div><div class="empty-log">まだ記録がありません</div></div>`;
  return `<div class="card"><div class="card-title">スキャン記録</div>${logs.map(l => `
    <div class="log-item">
      <div class="log-badge ${l.result}">${l.result === 'ok' ? 'OK' : 'NG'}</div>
      <div class="log-text">${l.name}（${l.code}）</div>
      <div class="log-time">${l.time}</div>
    </div>`).join('')}</div>`;
}

function goToStart() {
  ['cc','lg','cp','pc','pn','bk'].forEach(k => localStorage.removeItem(k));
  checkedCodes = []; logs = [];
  pendingCode = pendingName = null;
  currentProduct = null;
  renderProductScan();
}

function resetAll() {
  ['cc','lg','pc','pn'].forEach(k => localStorage.removeItem(k));
  checkedCodes = []; logs = [];
  pendingCode = pendingName = null;
  renderWait();
}

function renderProductScan() {
  document.getElementById('app').innerHTML = `
    <div class="wait-card">
      <div class="wait-icon">📋</div>
      <div class="wait-title">製造指示書をスキャンしてください</div>
      <div class="wait-sub">上の「スキャン開始」から製造指示書の<br>QRコードを読み取ってください</div>
    </div>
    <div class="card">
      <div class="card-title">手順</div>
      <div style="font-size:13px;color:var(--muted);line-height:2;">
        1. 上の「📷 スキャン開始」をタップ<br>
        2. 製造指示書のQRコードにカメラを向ける<br>
        3. 自動で読み取られます<br>
        4. 続けて原料のQRコードをスキャン
      </div>
    </div>
  `;
}

/* ─ 起動 ─ */
const hasD  = new URLSearchParams(window.location.search).get('d');

if (hasD)              processURL();
else if (currentProduct) { getBatchKg() === null ? renderBatchInput() : renderWait(); }
else                   renderProductScan();
</script>
